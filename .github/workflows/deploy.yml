name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key and known hosts
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 134.122.56.15 >> ~/.ssh/known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_rsa ledgeradmin@134.122.56.15 << 'EOF'
            set -euo pipefail
            sudo bash -c '
              set -euo pipefail
              cd /root/friendly-octo-spork || exit 1

              git fetch --all
              git reset --hard origin/main
              git clean -fd

              [ -d venv ] || python3 -m venv venv
              source venv/bin/activate
              python -m pip install --upgrade pip wheel setuptools
              pip install -r requirements.txt

              systemctl restart ledger.service
              systemctl status ledger.service --no-pager || true
            '
          EOF