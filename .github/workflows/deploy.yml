name: CI/CD Deployment

on:
  push:
    branches:
      - main
  pull_request:

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  deploy:
    # Only deploy pushes to main, and only if the tests passed.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Set up SSH key and known hosts
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned server fingerprint (not fetched at deploy time, which could be spoofed).
          echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Deploy to server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" << 'EOF'
            set -euo pipefail

            APP_DIR="$HOME/ledger/app/friendly-octo-spork"
            cd "$APP_DIR"

            # The container runs as UID 1000 and must be able to write the database.
            # Stop here (the running site stays up) if the data folder isn't owned by it.
            WRONG_OWNER="$(find "$HOME/ledger/data" ! -uid 1000 -print -quit 2>/dev/null || true)"
            if [ -n "$WRONG_OWNER" ]; then
              echo "ERROR: $HOME/ledger/data must be owned by UID 1000."
              echo "Run once on the server: sudo chown -R 1000:1000 ~/ledger/data"
              exit 1
            fi

            git fetch --all
            git reset --hard origin/main
            git clean -fd

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f

            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          EOF
