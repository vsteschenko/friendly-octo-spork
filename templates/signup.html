<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='forms.css') }}">
</head>
<body>
    <form method="post">
        <h1>Sign up</h1>
        <input type="text" name="email" placeholder="Email" id="field">
        <input type="password" name="password" placeholder="Password" id="field">
        <input type="password" name="confirm_password" placeholder="Confirm Password" id="field">
        {%if error %}
            <div style="color:red">{{ error }}</div>
        {% endif %}
        <input type="submit" value="Signup" id="login">
        <a href="/login">Already have an account?</a>
    </form>
</body>
</html>
